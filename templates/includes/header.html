{% load ui %}
<header id="main-header" class="site-header">
<div class="shell header-inner">
<a class="wordmark" dir="ltr" href="{% url 'core:home' %}" aria-label="DigiCode — {% text 'Accueil' 'الرئيسية' %}">{% if site_settings.logo %}<img src="{{ site_settings.logo.url }}" alt="DigiCode" width="140" height="40">{% else %}<span class="brand-mark" aria-hidden="true">d.</span>
<span>DigiCode<span class="brand-dot">.</span>
</span>{% endif %}</a>
<nav class="desktop-nav" aria-label="{% text 'Navigation principale' 'التنقل الرئيسي' %}">{% include 'includes/nav_links.html' %}</nav>
<div class="header-actions">
<div class="language-switch" aria-label="{% text 'Langue' 'اللغة' %}">
<a lang="fr" href="{% url 'core:set_language' 'fr' %}" {% if not IS_RTL %}aria-current="true"{% endif %}>FR</a>
<span>/</span>
<a lang="ar" href="{% url 'core:set_language' 'ar' %}" {% if IS_RTL %}aria-current="true"{% endif %}>عربي</a>
</div>
<a class="button button-small header-cta" href="{% url 'core:contact' %}#project-form">{% text 'Parlons de votre projet' 'لنناقش مشروعك' %}<span class="arrow" aria-hidden="true">↗</span>
</a>
<button id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="mobile-nav" aria-label="{% text 'Ouvrir le menu' 'فتح القائمة' %}" hidden>
<span>
</span>
<span>
</span>
</button>
</div>
</div>
<nav id="mobile-nav" class="mobile-nav shell" aria-label="{% text 'Navigation mobile' 'قائمة الهاتف' %}">{% include 'includes/nav_links.html' %}<a class="button" href="{% url 'core:contact' %}#project-form">{% text 'Parlons de votre projet' 'لنناقش مشروعك' %}</a>
</nav>
</header>
